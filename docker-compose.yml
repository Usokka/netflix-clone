services:
  # 1. Relational Database
  postgres-db:
    image: postgres:16-alpine
    container_name: netflix-db
    environment:
      POSTGRES_DB: netflix_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d netflix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # 2. In-Memory Cache
  redis-cache:
    image: redis:7-alpine
    container_name: netflix-cache
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # 3. Spring Boot Backend API
  backend-api:
    container_name: netflix-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/netflix_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-demo}
      - SUBSCRIPTION_DEMO_ACTIVATION_ENABLED=${SUBSCRIPTION_DEMO_ACTIVATION_ENABLED:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_FORWARDED_HEADERS=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/auth_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/auth_public_key
      - STREAMING_PRIVATE_KEY_PATH=/run/secrets/streaming_private_key
    depends_on:
      postgres-db:
        condition: service_healthy 
      redis-cache:
        condition: service_healthy
    networks:
      - app-network
      - db-network
    secrets:
      - auth_private_key
      - auth_public_key
      - streaming_private_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 4. Next.js frontend
  frontend-app:
    container_name: netflix-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend-api:8080
      - API_INTERNAL_URL=http://backend-api:8080
      - STREAMING_URL=http://streaming-service:8081
      - NODE_ENV=production
    depends_on:
      backend-api:
        condition: service_healthy
      streaming-service:
        condition: service_healthy
    networks:
      - app-network

  # 5. C++ Streaming service
  streaming-service:
    container_name: netflix-streaming
    build:
      context: ./streaming
      dockerfile: Dockerfile
    expose:
      - "8081"
    volumes:
      - ./streaming/videos:/app/videos:ro
    environment:
      - STREAMING_PUBLIC_KEY_PATH=/run/secrets/streaming_public_key
      - VIDEO_ROOT=/app/videos
    secrets:
      - streaming_public_key
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      app-network:
        aliases:
          - streaming-service 
networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  auth_private_key:
    file: ./infra/secrets/auth-private.pem
  auth_public_key:
    file: ./infra/secrets/auth-public.pem
  streaming_private_key:
    file: ./infra/secrets/streaming-private.pem
  streaming_public_key:
    file: ./infra/secrets/streaming-public.pem
