version: '3.8'

services:
  # 1. Relational Database
  postgres-db:
    image: postgres:16-alpine
    container_name: netflix-db
    environment:
      POSTGRES_DB: netflix_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d netflix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # 2. In-Memory Cache
  redis-cache:
    image: redis:7-alpine
    container_name: netflix-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - db-network

  # 3. Spring Boot Backend API
  backend-api:
    container_name: netflix-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/netflix_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    depends_on:
      postgres-db:
        condition: service_healthy 
      redis-cache:
        condition: service_started
    networks:
      - app-network
      - db-network

  # 4. Next Js Frontend (ALIGNÉ PARFAITEMENT)
  frontend-app:
    container_name: netflix-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend-api:8080/api/v1 
      - NODE_ENV=production
    depends_on:
      - backend-api
      - streaming-service
    links:
      - streaming-service
    networks:
      - app-network

  # 5. C++ Streaming service
  streaming-service:
    container_name: netflix-streaming
    build:
      context: ./streaming
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./streaming/videos:/app/videos
    networks:
      app-network:
        aliases:
          - streaming-service 
networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: