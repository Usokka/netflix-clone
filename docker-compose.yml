services:
  # 1. Relational Database
  postgres-db:
    image: postgres:16-alpine
    container_name: netflix-db
    environment:
      POSTGRES_DB: netflix_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d netflix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  # 2. In-Memory Cache
  redis-cache:
    image: redis:7-alpine
    container_name: netflix-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - db-network

networks:
  db-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: