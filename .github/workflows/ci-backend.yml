name: CI - Backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run tests
        run: mvn test
        working-directory: ./backend
      - name: Build Docker image
        run: docker build -t netflix-api ./backend